<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">US-003 — Quản lý Cơ hội</title>
<desc id="desc">Sơ đồ luồng ba màn hình nghiệp vụ cho US-003, truy vết AC-008 · AC-009.</desc>
<style>
.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d9e2ef}.line{stroke:#e6ebf2}.h1{font:700 28px Inter,'Segoe UI',Arial,sans-serif;fill:#07152f}.sub{font:400 14px Inter,'Segoe UI',Arial,sans-serif;fill:#64748b}.eyebrow{font:700 12px Inter,'Segoe UI',Arial,sans-serif;fill:#4634f2;letter-spacing:1px}.paneltitle{font:700 16px Inter,'Segoe UI',Arial,sans-serif;fill:#07152f}.body{font:400 14px Inter,'Segoe UI',Arial,sans-serif;fill:#3f526f}.chip{fill:#eef0ff}.chiptext{font:700 12px Inter,'Segoe UI',Arial,sans-serif;fill:#4634f2}.note{font:400 12px Inter,'Segoe UI',Arial,sans-serif;fill:#8da1c3}
</style>
<rect width="1440" height="820" class="bg"/>
<text x="56" y="56" class="eyebrow">US-003 · SALES</text>
<text x="56" y="94" class="h1">Quản lý Cơ hội</text>
<rect x="56" y="112" width="230" height="32" rx="16" class="chip"/>
<text x="74" y="133" class="chiptext">AC-008 · AC-009</text>
<text x="56" y="176" class="sub">Ba màn hình nghiệp vụ: danh sách Cơ hội của một Công ty → tạo Cơ hội → trạng thái kết quả.</text>

<rect x="56" y="208" width="392" height="500" rx="14" class="card"/>
<rect x="90" y="240" width="5" height="24" rx="3" fill="#695cff"/>
<text x="108" y="258" class="paneltitle">SCR-US003-01 · Cơ hội của Công ty</text>
<line x1="90" y1="278" x2="416" y2="278" class="line"/>
<circle cx="98" cy="310" r="4" fill="#5236f5"/><text x="112" y="315" class="body">Bảng Cơ hội cùng một Công ty</text>
<circle cx="98" cy="350" r="4" fill="#5236f5"/><text x="112" y="355" class="body">Cột: Tên · Giá trị dự kiến · Tháng chốt · Giai đoạn</text>
<circle cx="98" cy="390" r="4" fill="#5236f5"/><text x="112" y="395" class="body">Nút Tạo cơ hội</text>
<circle cx="98" cy="430" r="4" fill="#5236f5"/><text x="112" y="435" class="body">Nhiều Cơ hội cùng hiển thị (AC-009)</text>
<circle cx="98" cy="470" r="4" fill="#5236f5"/><text x="112" y="475" class="body">Empty: chưa có Cơ hội</text>
<circle cx="98" cy="510" r="4" fill="#5236f5"/><text x="112" y="515" class="body">Lỗi tải: giữ ngữ cảnh Công ty, cho Thử lại</text>

<path d="M 452 458 L 520 458" stroke="#bfcee0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

<rect x="524" y="208" width="392" height="500" rx="14" class="card"/>
<rect x="558" y="240" width="5" height="24" rx="3" fill="#695cff"/>
<text x="576" y="258" class="paneltitle">SCR-US003-02 · Tạo Cơ hội</text>
<line x1="558" y1="278" x2="884" y2="278" class="line"/>
<circle cx="566" cy="310" r="4" fill="#5236f5"/><text x="580" y="315" class="body">Ngữ cảnh Công ty hiển thị cố định</text>
<circle cx="566" cy="350" r="4" fill="#5236f5"/><text x="580" y="355" class="body">Tên cơ hội · Giá trị dự kiến</text>
<circle cx="566" cy="390" r="4" fill="#5236f5"/><text x="580" y="395" class="body">Tháng dự kiến chốt · Giai đoạn</text>
<circle cx="566" cy="430" r="4" fill="#5236f5"/><text x="580" y="435" class="body">Giai đoạn thuộc 7 giá trị BR-004</text>
<circle cx="566" cy="470" r="4" fill="#5236f5"/><text x="580" y="475" class="body">Hủy · Tạo cơ hội</text>
<circle cx="566" cy="510" r="4" fill="#5236f5"/><text x="580" y="515" class="body">Điều kiện bắt buộc/định dạng khác: Q-003-03</text>

<path d="M 920 458 L 988 458" stroke="#bfcee0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

<rect x="992" y="208" width="392" height="500" rx="14" class="card"/>
<rect x="1026" y="240" width="5" height="24" rx="3" fill="#695cff"/>
<text x="1044" y="258" class="paneltitle">SCR-US003-03 · Trạng thái kết quả</text>
<line x1="1026" y1="278" x2="1352" y2="278" class="line"/>
<circle cx="1034" cy="310" r="4" fill="#5236f5"/><text x="1048" y="315" class="body">Cơ hội đầu tiên gắn đúng Công ty</text>
<circle cx="1034" cy="350" r="4" fill="#5236f5"/><text x="1048" y="355" class="body">Cơ hội thứ hai cùng tồn tại (AC-009)</text>
<circle cx="1034" cy="390" r="4" fill="#5236f5"/><text x="1048" y="395" class="body">Empty state giữ ngữ cảnh Công ty</text>
<circle cx="1034" cy="430" r="4" fill="#5236f5"/><text x="1048" y="435" class="body">Lỗi có thể thử lại</text>
<circle cx="1034" cy="470" r="4" fill="#5236f5"/><text x="1048" y="475" class="body">Không suy diễn sửa/xóa/chi tiết (Q-003-01)</text>

<rect x="56" y="732" width="1328" height="58" rx="12" fill="#eef2f7"/>
<text x="80" y="756" class="note">Bao phủ: empty · not-found · lỗi có thể thử lại khi nguồn xác nhận; validation chi tiết còn chờ Q-003-03..04.</text>
<text x="80" y="776" class="note">Không quyết định framework, component library, endpoint hoặc cấu trúc triển khai.</text>

<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="#bfcee0"/>
</marker>
</defs>
</svg>
