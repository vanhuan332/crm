<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">SCR-US003-03 — Trạng thái Cơ hội</title><desc id="desc">Empty state và kết quả tạo cơ hội thứ nhất, thứ hai dưới đúng Công ty.</desc>
<style>.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d9e2ef}.h1{font:700 25px Inter,'Segoe UI',Arial;fill:#07152f}.title{font:700 16px Inter,'Segoe UI',Arial;fill:#172743}.body{font:400 14px Inter,'Segoe UI',Arial;fill:#536784}.strong{font:700 14px Inter,'Segoe UI',Arial;fill:#07152f}.hint{font:400 12px Inter,'Segoe UI',Arial;fill:#8da1c3}.btn{font:600 13px Inter,'Segoe UI',Arial}</style><rect width="1200" height="760" class="bg"/><text x="32" y="48" class="h1">Trạng thái danh sách Cơ hội</text><text x="32" y="75" class="body">Kết quả phải luôn bảo toàn ngữ cảnh Công ty.</text>
<rect x="32" y="112" width="350" height="320" rx="14" class="card"/><circle cx="207" cy="204" r="30" fill="#eef2f7"/><text x="196" y="214" font-family="Inter" font-size="28" fill="#8da1c3">＋</text><text x="129" y="264" class="title">Chưa có Cơ hội</text><text x="80" y="294" class="body">FPT Software chưa có thương vụ nào.</text><rect x="135" y="330" width="144" height="40" rx="7" fill="#5236f5"/><text x="165" y="355" class="btn" fill="#fff">Tạo cơ hội</text>
<rect x="425" y="112" width="350" height="320" rx="14" class="card"/><text x="451" y="152" class="title">Sau lần tạo thứ nhất</text><rect x="451" y="180" width="298" height="134" rx="10" fill="#f8faff" stroke="#c4c8ff"/><text x="473" y="218" class="strong">Chuyển đổi hệ thống ERP</text><text x="473" y="246" class="body">FPT Software</text><text x="473" y="274" class="body">Tiếp cận · 10/2026</text><rect x="451" y="336" width="298" height="52" rx="9" fill="#ecfdf5"/><text x="473" y="368" class="body" fill="#166534">✓ Đã gắn vào đúng Công ty</text>
<rect x="818" y="112" width="350" height="320" rx="14" class="card"/><text x="844" y="152" class="title">Sau lần tạo thứ hai</text><rect x="844" y="180" width="298" height="92" rx="10" fill="#f8faff" stroke="#d9e2ef"/><text x="866" y="215" class="strong">Chuyển đổi hệ thống ERP</text><text x="866" y="243" class="body">FPT Software</text><rect x="844" y="286" width="298" height="92" rx="10" fill="#f8faff" stroke="#c4c8ff"/><text x="866" y="321" class="strong">Dịch vụ kiểm thử 2027</text><text x="866" y="349" class="body">FPT Software</text><text x="844" y="406" class="body">Hai Cơ hội cùng tồn tại.</text>
<rect x="32" y="472" width="1136" height="90" rx="12" fill="#fff8e8" stroke="#f5c84b"/><text x="58" y="507" class="title" fill="#9a5a00">Không suy diễn phạm vi sửa/xóa/chi tiết</text><text x="58" y="536" class="body">US-003 chưa có AC cho các hành vi này; chờ Q-003-01 thay vì đưa thành hành động đã xác nhận.</text><rect x="32" y="592" width="1136" height="70" rx="12" fill="#eef6ff"/><text x="58" y="621" class="title" fill="#1d4ed8">Lỗi có thể phục hồi</text><text x="58" y="647" class="body">Nếu tải danh sách thất bại, giữ ngữ cảnh FPT Software và cho phép Thử lại.</text><text x="32" y="736" class="hint">SCR-US003-03 · US-003 · AC-008, AC-009 · Recoverable-error presentation là giả định UX.</text></svg>
