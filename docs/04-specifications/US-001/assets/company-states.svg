<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">SCR-US001-05 — Trạng thái và phản hồi</title>
  <desc id="desc">Các trạng thái validation, xác nhận xóa, thành công, empty, not-found và lỗi có thể thử lại của US-001.</desc>
  <style>.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d9e2ef}.h1{font:700 25px Inter,'Segoe UI',Arial,sans-serif;fill:#07152f}.title{font:700 16px Inter,'Segoe UI',Arial,sans-serif;fill:#172743}.label{font:500 14px Inter,'Segoe UI',Arial,sans-serif;fill:#14233e}.body{font:400 14px Inter,'Segoe UI',Arial,sans-serif;fill:#536784}.hint{font:400 12px Inter,'Segoe UI',Arial,sans-serif;fill:#8da1c3}.error{font:500 12px Inter,'Segoe UI',Arial,sans-serif;fill:#dc2626}.btn{font:600 13px Inter,'Segoe UI',Arial,sans-serif}</style>
  <rect width="1200" height="900" class="bg"/><text x="32" y="48" class="h1">Trạng thái màn hình Công ty</text><text x="32" y="74" class="body">Validation và phản hồi phục hồi cho US-001</text>

  <rect x="32" y="106" width="548" height="326" rx="14" class="card"/><text x="58" y="142" class="title">Validation — thiếu trường bắt buộc</text><text x="58" y="170" class="body">Hệ thống từ chối lưu và chỉ rõ từng trường còn thiếu.</text>
  <text x="58" y="216" class="label">Tên công ty <tspan fill="#dc2626">*</tspan></text><rect x="58" y="230" width="496" height="43" rx="6" fill="#fff" stroke="#ef4444"/><text x="58" y="292" class="error">Vui lòng nhập tên công ty.</text>
  <text x="58" y="332" class="label">Loại công ty <tspan fill="#dc2626">*</tspan></text><rect x="58" y="346" width="496" height="43" rx="6" fill="#fff" stroke="#ef4444"/><text x="74" y="373" class="hint">Chọn một trong 5 loại công ty</text><text x="58" y="410" class="error">Vui lòng chọn loại công ty.</text>

  <rect x="612" y="106" width="556" height="326" rx="14" class="card"/><rect x="612" y="106" width="556" height="326" rx="14" fill="#15213a" opacity=".08"/><rect x="676" y="170" width="428" height="206" rx="14" fill="#fff" stroke="#d9e2ef"/><circle cx="720" cy="218" r="22" fill="#fff1f2"/><text x="711" y="225" font-family="Inter" font-size="20" fill="#dc2626">!</text><text x="756" y="214" class="title">Xóa FPT Software?</text><text x="756" y="240" class="body">Công ty sẽ bị gỡ khỏi danh sách.</text><text x="704" y="274" class="hint">Chính sách khi có dữ liệu liên quan vẫn cần PO quyết định.</text><rect x="858" y="306" width="92" height="40" rx="6" fill="#fff" stroke="#bfcee0"/><text x="881" y="331" class="btn" fill="#263a59">Hủy</text><rect x="962" y="306" width="112" height="40" rx="6" fill="#dc2626"/><text x="990" y="331" class="btn" fill="#fff">Xóa công ty</text>

  <rect x="32" y="464" width="350" height="174" rx="14" class="card"/><circle cx="207" cy="510" r="22" fill="#eef2f7"/><text x="199" y="518" font-family="Inter" font-size="22" fill="#8da1c3">＋</text><text x="142" y="554" class="title">Chưa có công ty</text><text x="88" y="580" class="body">Tạo công ty đầu tiên để bắt đầu quản lý.</text><rect x="140" y="596" width="134" height="34" rx="6" fill="#5236f5"/><text x="165" y="618" class="btn" fill="#fff">Tạo công ty</text>
  <rect x="425" y="464" width="350" height="174" rx="14" class="card"/><circle cx="600" cy="510" r="22" fill="#fff5f5"/><text x="592" y="518" font-family="Inter" font-size="22" fill="#dc2626">!</text><text x="510" y="554" class="title">Không tìm thấy công ty</text><text x="475" y="580" class="body">Hồ sơ không tồn tại hoặc đã bị xóa.</text><rect x="532" y="596" width="136" height="34" rx="6" fill="#fff" stroke="#bfcee0"/><text x="553" y="618" class="btn" fill="#263a59">Về danh sách</text>
  <rect x="818" y="464" width="350" height="174" rx="14" class="card"/><circle cx="993" cy="510" r="22" fill="#fff9e9"/><text x="985" y="518" font-family="Inter" font-size="22" fill="#b66a00">↻</text><text x="921" y="554" class="title">Không thể tải dữ liệu</text><text x="873" y="580" class="body">Kiểm tra kết nối và thử lại thao tác.</text><rect x="934" y="596" width="118" height="34" rx="6" fill="#fff" stroke="#bfcee0"/><text x="966" y="618" class="btn" fill="#263a59">Thử lại</text>

  <rect x="32" y="678" width="1136" height="92" rx="12" fill="#ecfdf5" stroke="#86efac"/><circle cx="76" cy="724" r="20" fill="#22c55e"/><text x="69" y="731" font-family="Inter" font-size="18" font-weight="700" fill="#fff">✓</text><text x="112" y="716" class="title" fill="#166534">Lưu thành công</text><text x="112" y="742" class="body" fill="#166534">Thông tin FPT Software đã được cập nhật.</text>
  <text x="32" y="808" class="hint">Loading: dùng skeleton trong vùng bảng/form, giữ nguyên cấu trúc trang và khóa hành động lưu trong lúc xử lý.</text><text x="32" y="832" class="hint">SCR-US001-05 · US-001 · AC-002, AC-004 · Delete confirmation là biện pháp an toàn giao diện, không quyết định chính sách xóa dữ liệu liên quan.</text>
</svg>
