  <text x="202" y="821" class="hint"><tspan fill="#dc2626">*</tspan> Bắt buộc</text><rect x="786" y="804" width="84" height="46" rx="7" fill="#fff" stroke="#bfcee0"/><text x="811" y="833" class="btn" fill="#263a59">Hủy</text><rect x="884" y="804" width="114" height="46" rx="7" fill="#5236f5"/><text x="909" y="833" class="btn" fill="#fff">Tạo công ty</text>
