<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">SCR-US011-03 — Trạng thái Bản lưu</title><desc id="desc">Trạng thái chưa có bản lưu, có bản lưu mới và ranh giới nguồn không đọc được.</desc><style>.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d9e2ef}.h1{font:700 25px Inter,'Segoe UI',Arial;fill:#07152f}.title{font:700 16px Inter,'Segoe UI',Arial;fill:#172743}.body{font:400 14px Inter,'Segoe UI',Arial;fill:#536784}.hint{font:400 12px Inter,'Segoe UI',Arial;fill:#8da1c3}</style><rect width="1200" height="760" class="bg"/><text x="32" y="48" class="h1">Trạng thái Bản lưu nguồn</text><text x="32" y="75" class="body">Mỗi lần đọc thành công thêm một Observation mới.</text><rect x="32" y="112" width="548" height="280" rx="14" class="card"/><circle cx="306" cy="190" r="30" fill="#eef2f7"/><text x="295" y="200" font-family="Inter" font-size="27" fill="#8da1c3">○</text><text x="236" y="250" class="title">Chưa có Bản lưu</text><text x="145" y="282" class="body">Chưa có Observation để truy cứu cho Công ty này.</text><text x="156" y="324" class="hint">Việc đọc nguồn do A-AI thực hiện, không có nút tạo thủ công.</text><rect x="612" y="112" width="556" height="280" rx="14" class="card"/><circle cx="890" cy="180" r="26" fill="#ecfdf5"/><text x="881" y="189" font-family="Inter" font-size="22" fill="#047857">✓</text><text x="812" y="232" class="title">Đã thêm Bản lưu mới</text><text x="748" y="264" class="body">Observation 14/08/2026 · 09:30 đứng đầu danh sách.</text><text x="748" y="304" class="hint">Bản cũ vẫn tồn tại; không bị ghi đè.</text><rect x="32" y="432" width="1136" height="104" rx="12" fill="#fff8e8" stroke="#f5c84b"/><text x="58" y="469" class="title" fill="#9a5a00">Nguồn không đọc được</text><text x="58" y="500" class="body">Hành vi chi tiết thuộc US-012; asset US-011 không tự định nghĩa retry, lỗi hay liên kết điều hướng.</text><rect x="32" y="570" width="1136" height="70" rx="12" fill="#eef6ff"/><text x="58" y="611" class="body" fill="#1d4ed8">Danh sách luôn xếp theo thời điểm đọc; bản mới nhất ở trên.</text><text x="32" y="710" class="hint">SCR-US011-03 · US-011 · AC-025, AC-026</text></svg>
