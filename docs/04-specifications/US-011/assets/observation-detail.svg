  <text x="90" y="538" class="mono">&lt;article&gt;</text>
  <text x="112" y="568" class="mono">&lt;h1&gt;FPT Software mở rộng trung tâm chuyển đổi số&lt;/h1&gt;</text>
  <text x="112" y="598" class="mono">&lt;p&gt;Doanh nghiệp công bố kế hoạch mở rộng dịch vụ cloud và dữ liệu...&lt;/p&gt;</text>
  <text x="112" y="628" class="mono">&lt;p&gt;Chương trình dự kiến triển khai trong quý IV năm 2026...&lt;/p&gt;</text>
  <text x="90" y="658" class="mono">&lt;/article&gt;</text>
  <text x="66" y="836" class="muted">Nội dung được giữ nguyên như đọc được; màn hình không sửa, rút gọn hoặc chuẩn hóa văn bản nguồn (BR-US011-01).</text>
  <text x="66" y="864" class="muted">Đây là Bản lưu (Observation), không phải Phát hiện (Claim); xem AC-028..030 (US-013) cho phần rút phát hiện.</text>

