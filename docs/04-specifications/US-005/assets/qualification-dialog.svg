<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">SCR-US005-01 — Hộp thoại Đủ điều kiện</title><desc id="desc">Prompt thu thập dấu hiệu nhu cầu và ngân sách, mỗi dấu hiệu có nguồn.</desc><style>.bg{fill:#f7f9fc}.overlay{fill:#15213a;opacity:.22}.card{fill:#fff;stroke:#d9e2ef}.h1{font:700 23px Inter,'Segoe UI',Arial;fill:#07152f}.section{font:700 15px Inter,'Segoe UI',Arial;fill:#263a59}.label{font:500 14px Inter,'Segoe UI',Arial;fill:#14233e}.body{font:400 14px Inter,'Segoe UI',Arial;fill:#536784}.input{fill:#fff;stroke:#becde1}.value{font:400 13px Inter,'Segoe UI',Arial;fill:#07152f}.hint{font:400 12px Inter,'Segoe UI',Arial;fill:#8da1c3}.btn{font:600 14px Inter,'Segoe UI',Arial}</style><rect width="1200" height="820" class="bg"/><rect x="32" y="80" width="1136" height="640" rx="14" fill="#fff"/><rect width="1200" height="820" class="overlay"/><rect x="250" y="52" width="700" height="716" rx="16" class="card"/><text x="286" y="100" class="h1">Đưa Cơ hội vào “Đủ điều kiện”</text><text x="286" y="130" class="body">Bổ sung hai dấu hiệu có nguồn hoặc bỏ qua để chuyển giai đoạn ngay.</text>
