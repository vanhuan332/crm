<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">SCR-US005-02 — Cảnh báo thiếu dấu hiệu</title><desc id="desc">Cơ hội vẫn ở Đủ điều kiện nhưng mang cảnh báo cho tới khi đủ nhu cầu và ngân sách có nguồn.</desc><style>.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d9e2ef}.h1{font:700 25px Inter,'Segoe UI',Arial;fill:#07152f}.title{font:700 16px Inter,'Segoe UI',Arial;fill:#172743}.body{font:400 14px Inter,'Segoe UI',Arial;fill:#536784}.strong{font:700 14px Inter,'Segoe UI',Arial;fill:#07152f}.tag{font:600 11px Inter,'Segoe UI',Arial}.btn{font:600 13px Inter,'Segoe UI',Arial}.hint{font:400 12px Inter,'Segoe UI',Arial;fill:#8da1c3}</style><rect width="1200" height="760" class="bg"/><text x="32" y="48" class="h1">Cơ hội cần bổ sung điều kiện</text><text x="32" y="75" class="body">Bỏ qua không chặn chuyển giai đoạn.</text><rect x="32" y="112" width="1136" height="164" rx="14" class="card"/><rect x="58" y="138" width="64" height="30" rx="15" fill="#eef6ff"/><text x="76" y="158" class="tag" fill="#1d4ed8">Đủ điều kiện</text><text x="58" y="204" class="title">Cloud Migration · FPT Software</text><text x="58" y="234" class="body">1,2 tỷ · dự kiến chốt 12/2026</text><rect x="846" y="154" width="278" height="76" rx="10" fill="#fff8e8" stroke="#f5c84b"/><text x="866" y="181" class="strong" fill="#9a5a00">⚠ Thiếu thông tin qualification</text><text x="866" y="207" class="body">Cần bổ sung nhu cầu và ngân sách.</text>
