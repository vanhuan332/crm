<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">SCR-US005-03 — Trạng thái Qualification</title><desc id="desc">So sánh complete không cảnh báo và incomplete có cảnh báo nhưng không chặn chuyển stage.</desc><style>.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d9e2ef}.h1{font:700 25px Inter,'Segoe UI',Arial;fill:#07152f}.title{font:700 16px Inter,'Segoe UI',Arial;fill:#172743}.body{font:400 14px Inter,'Segoe UI',Arial;fill:#536784}.strong{font:700 14px Inter,'Segoe UI',Arial;fill:#07152f}.hint{font:400 12px Inter,'Segoe UI',Arial;fill:#8da1c3}.tag{font:600 11px Inter,'Segoe UI',Arial}</style><rect width="1200" height="760" class="bg"/><text x="32" y="48" class="h1">Trạng thái chốt Đủ điều kiện</text><text x="32" y="75" class="body">Hai chiều kiểm tra: nhu cầu và khả năng chi trả.</text>
<rect x="32" y="112" width="548" height="424" rx="14" class="card"/><rect x="32" y="112" width="548" height="64" rx="14" fill="#ecfdf5"/><text x="58" y="151" class="title" fill="#166534">✓ Hoàn tất · Không cảnh báo</text><text x="58" y="216" class="strong">Nhu cầu</text><text x="58" y="246" class="body">Cần hợp nhất dữ liệu từ 4 hệ thống.</text><text x="58" y="274" class="hint">Nguồn: Biên bản họp 12/08/2026</text><line x1="58" y1="300" x2="554" y2="300" stroke="#e7edf4"/><text x="58" y="338" class="strong">Ngân sách</text><text x="58" y="368" class="body">Ngân sách quý IV đã được duyệt.</text><text x="58" y="396" class="hint">Nguồn: Email PIC 10/08/2026</text><rect x="58" y="446" width="114" height="30" rx="15" fill="#eef6ff"/><text x="76" y="466" class="tag" fill="#1d4ed8">Đủ điều kiện</text>
<rect x="612" y="112" width="556" height="424" rx="14" class="card"/><rect x="612" y="112" width="556" height="64" rx="14" fill="#fff8e8"/><text x="638" y="151" class="title" fill="#9a5a00">⚠ Chưa hoàn tất · Có cảnh báo</text><text x="638" y="216" class="strong">Nhu cầu</text><text x="638" y="246" class="body">Chưa có nội dung hoặc nguồn.</text><line x1="638" y1="280" x2="1142" y2="280" stroke="#e7edf4"/><text x="638" y="318" class="strong">Ngân sách</text><text x="638" y="348" class="body">Chưa có nội dung hoặc nguồn.</text><rect x="638" y="398" width="114" height="30" rx="15" fill="#eef6ff"/><text x="656" y="418" class="tag" fill="#1d4ed8">Đủ điều kiện</text><text x="638" y="466" class="body">Giai đoạn vẫn chuyển thành công.</text>
<rect x="32" y="570" width="1136" height="88" rx="12" fill="#fff" stroke="#d9e2ef"/><text x="58" y="604" class="title">Nguồn của dấu hiệu</text><text x="58" y="632" class="body">Định dạng nguồn cụ thể chưa được PO quyết định tại Q-005-01; thiết kế chỉ thể hiện một trường nguồn, không áp đặt format.</text><text x="32" y="736" class="hint">SCR-US005-03 · US-005 · AC-013, AC-014</text></svg>
