<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">US-008 — Việc tiếp theo &amp; ngày hạn</title>
  <desc id="desc">Sơ đồ luồng màn hình nghiệp vụ cho US-008, truy vết AC-019 · AC-020.</desc>
  <style>
    .bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d9e2ef}.line{stroke:#e6ebf2}
    .h1{font:700 26px Inter,'Segoe UI',Arial,sans-serif;fill:#07152f}
    .eyebrow{font:700 12px Inter,'Segoe UI',Arial,sans-serif;fill:#5236f5;letter-spacing:1.2px}
    .sub{font:400 14px Inter,'Segoe UI',Arial,sans-serif;fill:#64748b}
    .paneltitle{font:700 15px Inter,'Segoe UI',Arial,sans-serif;fill:#263a59}
    .body{font:400 14px Inter,'Segoe UI',Arial,sans-serif;fill:#3f526f}
    .chip{fill:#eef0ff;stroke:#c4c8ff}.chiptext{font:700 12px Inter,'Segoe UI',Arial,sans-serif;fill:#4634f2}
    .note{font:400 12px Inter,'Segoe UI',Arial,sans-serif;fill:#8da1c3}
    .arrow{stroke:#bfcee0;stroke-width:2;fill:none}
  </style>
  <rect width="1400" height="780" class="bg"/>

  <text x="40" y="42" class="eyebrow">US-008 · SALES</text>
  <text x="40" y="76" class="h1">Việc tiếp theo &amp; ngày hạn của Cơ hội</text>
  <rect x="40" y="94" width="216" height="30" rx="15" class="chip"/>
  <text x="58" y="114" class="chiptext">AC-019 · AC-020</text>
  <text x="40" y="146" class="sub">Luồng màn hình và trạng thái nghiệp vụ · chỉ áp dụng cho cơ hội mở (BR-004)</text>

  <!-- Card 1 -->
  <rect x="40" y="176" width="416" height="470" rx="14" class="card"/>
  <rect x="40" y="176" width="416" height="60" rx="14" fill="#eef0ff"/>
  <rect x="40" y="222" width="416" height="14" fill="#eef0ff"/>
  <rect x="40" y="176" width="5" height="60" fill="#695cff"/>
  <text x="64" y="212" class="paneltitle">SCR-US008-01 · Việc tiếp theo của Cơ hội</text>
  <circle cx="66" cy="266" r="5" fill="#695cff"/><text x="82" y="272" class="body">Việc tiếp theo (mô tả việc cần làm)</text>
  <circle cx="66" cy="308" r="5" fill="#695cff"/><text x="82" y="314" class="body">Ngày hạn</text>
  <circle cx="66" cy="350" r="5" fill="#695cff"/><text x="82" y="356" class="body">Lưu được dù thiếu một ô</text>
  <circle cx="66" cy="392" r="5" fill="#695cff"/><text x="82" y="398" class="body">Cờ cảnh báo hiện ngay khi thiếu</text>
  <circle cx="66" cy="434" r="5" fill="#695cff"/><text x="82" y="440" class="body">Không chặn thao tác lưu của Sales</text>
  <circle cx="66" cy="476" r="5" fill="#695cff"/><text x="82" y="482" class="body">Bổ sung sau → tự đủ điều kiện</text>

  <!-- Arrow 1 to 2 -->
  <path class="arrow" d="M456 411 L488 411" marker-end="url(#arrow)"/>

  <!-- Card 2 -->
  <rect x="492" y="176" width="416" height="470" rx="14" class="card"/>
  <rect x="492" y="176" width="416" height="60" rx="14" fill="#eef0ff"/>
  <rect x="492" y="222" width="416" height="14" fill="#eef0ff"/>
  <rect x="492" y="176" width="5" height="60" fill="#695cff"/>
  <text x="516" y="212" class="paneltitle">SCR-US008-02 · Danh sách việc phải làm</text>
  <circle cx="518" cy="266" r="5" fill="#695cff"/><text x="534" y="272" class="body">Chỉ hiện cơ hội đủ hai ô</text>
  <circle cx="518" cy="308" r="5" fill="#695cff"/><text x="534" y="314" class="body">Sắp/xem theo ngày hạn</text>
  <circle cx="518" cy="350" r="5" fill="#695cff"/><text x="534" y="356" class="body">Cột: ngày hạn · việc · cơ hội · công ty</text>
  <circle cx="518" cy="392" r="5" fill="#695cff"/><text x="534" y="398" class="body">Không chứa cơ hội đang thiếu ô</text>
  <circle cx="518" cy="434" r="5" fill="#695cff"/><text x="534" y="440" class="body">Empty: chưa có việc đủ điều kiện</text>
  <circle cx="518" cy="476" r="5" fill="#695cff"/><text x="534" y="482" class="body">Lỗi tải: có nút thử lại</text>

  <!-- Arrow 2 to 3 -->
  <path class="arrow" d="M908 411 L940 411" marker-end="url(#arrow)"/>

  <!-- Card 3 -->
  <rect x="944" y="176" width="416" height="470" rx="14" class="card"/>
  <rect x="944" y="176" width="416" height="60" rx="14" fill="#eef0ff"/>
  <rect x="944" y="222" width="416" height="14" fill="#eef0ff"/>
  <rect x="944" y="176" width="5" height="60" fill="#695cff"/>
  <text x="968" y="212" class="paneltitle">SCR-US008-03 · Trạng thái đủ / thiếu</text>
  <circle cx="970" cy="266" r="5" fill="#22c55e"/><text x="986" y="272" class="body">Đủ hai ô → có trong danh sách</text>
  <circle cx="970" cy="308" r="5" fill="#b66a00"/><text x="986" y="314" class="body">Thiếu một ô → lưu + cờ, ẩn khỏi danh sách</text>
  <circle cx="970" cy="350" r="5" fill="#8da1c3"/><text x="986" y="356" class="body">Trống cả hai → đang chờ PO (Q-008-02)</text>
  <circle cx="970" cy="392" r="5" fill="#8da1c3"/><text x="986" y="398" class="body">Empty / lỗi tải có thể thử lại</text>
  <circle cx="970" cy="434" r="5" fill="#8da1c3"/><text x="986" y="440" class="body">Không dùng màu làm tín hiệu duy nhất</text>
  <circle cx="970" cy="476" r="5" fill="#8da1c3"/><text x="986" y="482" class="body">Lưu thành công → banner xác nhận</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#bfcee0"/>
    </marker>
  </defs>

  <rect x="40" y="672" width="1320" height="76" rx="12" fill="#eef6ff"/>
  <text x="64" y="700" class="body" fill="#1d4ed8">Bao phủ: đủ thông tin · thiếu một ô · trống cả hai (open question) · empty · lỗi có thể thử lại · lưu thành công.</text>
  <text x="64" y="724" class="note">Chỉ áp dụng cho cơ hội mở (BR-004) · Không quyết định framework, component library, endpoint hoặc cấu trúc triển khai.</text>
</svg>
