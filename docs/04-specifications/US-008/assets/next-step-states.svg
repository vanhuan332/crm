<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">SCR-US008-03 — Trạng thái Việc tiếp theo</title><desc id="desc">So sánh đủ hai ô và thiếu một ô vẫn lưu nhưng có cảnh báo.</desc><style>.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d9e2ef}.h1{font:700 25px Inter,'Segoe UI',Arial;fill:#07152f}.title{font:700 16px Inter,'Segoe UI',Arial;fill:#172743}.body{font:400 14px Inter,'Segoe UI',Arial;fill:#536784}.label{font:600 12px Inter,'Segoe UI',Arial;fill:#60718f}.hint{font:400 12px Inter,'Segoe UI',Arial;fill:#8da1c3}</style><rect width="1200" height="760" class="bg"/><text x="32" y="48" class="h1">Trạng thái Việc tiếp theo</text><text x="32" y="75" class="body">Cảnh báo không phải validation chặn lưu.</text><rect x="32" y="112" width="548" height="350" rx="14" class="card"/><rect x="32" y="112" width="548" height="64" rx="14" fill="#ecfdf5"/><text x="58" y="151" class="title" fill="#166534">✓ Đủ thông tin</text><text x="58" y="220" class="label">VIỆC TIẾP THEO</text><text x="58" y="250" class="body">Chuẩn bị agenda workshop</text><text x="58" y="302" class="label">NGÀY HẠN</text><text x="58" y="332" class="body">18/08/2026</text><rect x="58" y="378" width="310" height="44" rx="8" fill="#eef6ff"/><text x="78" y="405" class="body" fill="#1d4ed8">Có trong danh sách việc phải làm</text>
<rect x="612" y="112" width="556" height="350" rx="14" class="card"/><rect x="612" y="112" width="556" height="64" rx="14" fill="#fff8e8"/><text x="638" y="151" class="title" fill="#9a5a00">⚠ Thiếu ngày hạn · Đã lưu</text><text x="638" y="220" class="label">VIỆC TIẾP THEO</text><text x="638" y="250" class="body">Chuẩn bị agenda workshop</text><text x="638" y="302" class="label">NGÀY HẠN</text><text x="638" y="332" class="body" fill="#dc2626">Chưa có</text><rect x="638" y="378" width="378" height="44" rx="8" fill="#fff1f2"/><text x="658" y="405" class="body" fill="#dc2626">Không có trong danh sách việc phải làm</text><rect x="32" y="502" width="1136" height="92" rx="12" fill="#eef6ff"/><text x="58" y="538" class="title" fill="#1d4ed8">Thiếu Việc tiếp theo hoặc ngày hạn</text><text x="58" y="567" class="body">Luôn lưu thành công, gắn cờ cảnh báo và loại khỏi danh sách cho tới khi đủ cả hai.</text><rect x="32" y="624" width="1136" height="58" rx="12" fill="#fff8e8"/><text x="58" y="659" class="body">Thiếu cả hai và hành vi với Cơ hội đóng vẫn chờ Q-008-02/Q-008-04.</text><text x="32" y="736" class="hint">SCR-US008-03 · US-008 · AC-019, AC-020</text></svg>
