<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">US-009 — Luồng Tìm kiếm và Lọc</title>
  <desc id="desc">Sơ đồ luồng màn hình nghiệp vụ cho US-009, truy vết AC-021 · AC-022 · AC-023.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#bfcee0"/>
    </marker>
  </defs>
  <style>
    .bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d9e2ef}.h1{font:700 25px Inter,'Segoe UI',Arial,sans-serif;fill:#07152f}.sub{font:400 14px Inter,'Segoe UI',Arial,sans-serif;fill:#64748b}.section{font:700 15px Inter,'Segoe UI',Arial,sans-serif;fill:#07152f}.body{font:400 14px Inter,'Segoe UI',Arial,sans-serif;fill:#3f526f}.hint{font:400 12px Inter,'Segoe UI',Arial,sans-serif;fill:#8da1c3}.note{font:400 13px Inter,'Segoe UI',Arial,sans-serif;fill:#60718f}.arrow{stroke:#bfcee0;stroke-width:2;fill:none}
  </style>
  <rect width="1280" height="760" class="bg"/>
  <text x="32" y="46" class="h1">Luồng Tìm kiếm và Lọc</text>
  <text x="32" y="72" class="sub">US-009 · Sales · AC-021, AC-022, AC-023</text>

  <rect x="32" y="104" width="360" height="420" rx="14" class="card"/>
  <rect x="32" y="104" width="360" height="60" rx="14" fill="#f3f0ff"/>
  <rect x="32" y="150" width="360" height="14" fill="#f3f0ff"/>
  <rect x="60" y="128" width="5" height="22" rx="3" fill="#695cff"/>
  <text x="78" y="144" class="section">SCR-US009-01 · Danh sách Công ty</text>
  <circle cx="66" cy="192" r="4" fill="#5236f5"/><text x="82" y="197" class="body">Gõ một phần Tên công ty (AC-021)</text>
  <circle cx="66" cy="228" r="4" fill="#5236f5"/><text x="82" y="233" class="body">Lọc Ngành / Loại / Quốc gia (AC-022)</text>
  <circle cx="66" cy="264" r="4" fill="#5236f5"/><text x="82" y="269" class="body">Lọc theo nhãn Đang theo dõi (AC-022)</text>
  <circle cx="66" cy="300" r="4" fill="#5236f5"/><text x="82" y="305" class="body">Danh sách chỉ còn Công ty khớp</text>
  <rect x="60" y="332" width="304" height="1" fill="#e6ebf2"/>
  <text x="60" y="364" class="hint">Kết hợp nhiều tiêu chí cùng lúc</text>
  <text x="60" y="384" class="hint">chưa được nguồn quy định (Q-009-01).</text>

  <path d="M392 314 H460" class="arrow" marker-end="url(#arrow)"/>

  <rect x="460" y="104" width="360" height="420" rx="14" class="card"/>
  <rect x="460" y="104" width="360" height="60" rx="14" fill="#f3f0ff"/>
  <rect x="460" y="150" width="360" height="14" fill="#f3f0ff"/>
  <rect x="488" y="128" width="5" height="22" rx="3" fill="#695cff"/>
  <text x="506" y="144" class="section">SCR-US009-02 · Danh sách Cơ hội</text>
  <circle cx="494" cy="192" r="4" fill="#5236f5"/><text x="510" y="197" class="body">Lọc theo Giai đoạn (AC-023)</text>
  <circle cx="494" cy="228" r="4" fill="#5236f5"/><text x="510" y="233" class="body">Lọc theo tình trạng quá hạn Việc tiếp theo (AC-023)</text>
  <circle cx="494" cy="264" r="4" fill="#5236f5"/><text x="510" y="269" class="body">Danh sách chỉ còn Cơ hội thỏa lọc</text>
  <circle cx="494" cy="300" r="4" fill="#5236f5"/><text x="510" y="305" class="body">Không đổi dữ liệu Cơ hội (BR-US009-04)</text>

  <path d="M820 314 H888" class="arrow" marker-end="url(#arrow)"/>

  <rect x="888" y="104" width="360" height="420" rx="14" class="card"/>
  <rect x="888" y="104" width="360" height="60" rx="14" fill="#fff7e6"/>
  <rect x="888" y="150" width="360" height="14" fill="#fff7e6"/>
  <rect x="916" y="128" width="5" height="22" rx="3" fill="#e2a63b"/>
  <text x="934" y="144" class="section">SCR-US009-03 · Trạng thái kết quả</text>
  <circle cx="922" cy="192" r="4" fill="#e2a63b"/><text x="938" y="197" class="body">Có kết quả: hiển thị số mục khớp</text>
  <circle cx="922" cy="228" r="4" fill="#e2a63b"/><text x="938" y="233" class="body">Không có kết quả: empty state + xóa lọc</text>
  <circle cx="922" cy="264" r="4" fill="#e2a63b"/><text x="938" y="269" class="body">Lỗi có thể thử lại: giữ nguyên tiêu chí</text>
  <circle cx="922" cy="300" r="4" fill="#e2a63b"/><text x="938" y="305" class="body">Đang tải: khung kết quả dùng skeleton</text>

  <rect x="32" y="548" width="1216" height="140" rx="12" fill="#fff8e8" stroke="#f5c84b"/>
  <text x="58" y="580" class="section" fill="#9a5a00">Câu hỏi nghiệp vụ còn mở</text>
  <text x="58" y="608" class="note">Q-009-01 · Cách kết hợp nhiều tiêu chí lọc cùng lúc (AND/OR) chưa được nêu trong nguồn.</text>
  <text x="58" y="632" class="note">Q-009-02 · Quyền của Quản trị đối với chức năng tìm/lọc chưa được nêu trong nguồn.</text>
  <text x="58" y="656" class="note">Q-009-03 · Nội dung/hành động cụ thể của trạng thái không có kết quả chưa được nêu trong nguồn.</text>

  <text x="32" y="716" class="hint">Wireframe nghiệp vụ · không quyết định framework, component library, endpoint hoặc cấu trúc triển khai.</text>
  <text x="32" y="736" class="hint">US-009 · FEAT-009 · REQ-111 · T-1</text>
</svg>
