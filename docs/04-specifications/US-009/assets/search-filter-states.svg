<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">SCR-US009-03 — Trạng thái Tìm/Lọc</title><desc id="desc">Trạng thái có kết quả, không có kết quả và ranh giới kết hợp nhiều bộ lọc.</desc><style>.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d9e2ef}.h1{font:700 25px Inter,'Segoe UI',Arial;fill:#07152f}.title{font:700 16px Inter,'Segoe UI',Arial;fill:#172743}.body{font:400 14px Inter,'Segoe UI',Arial;fill:#536784}.hint{font:400 12px Inter,'Segoe UI',Arial;fill:#8da1c3}.btn{font:600 13px Inter,'Segoe UI',Arial}</style><rect width="1200" height="760" class="bg"/><text x="32" y="48" class="h1">Trạng thái Tìm kiếm và Lọc</text><text x="32" y="75" class="body">Tìm/lọc chỉ thu hẹp kết quả, không thay đổi dữ liệu.</text><rect x="32" y="112" width="548" height="300" rx="14" class="card"/><text x="58" y="152" class="title">Có kết quả</text><rect x="58" y="182" width="496" height="54" rx="8" fill="#eef6ff"/><text x="80" y="215" class="body" fill="#1d4ed8">3 Công ty khớp “soft”</text><rect x="58" y="256" width="496" height="52" rx="8" fill="#fbfcfe" stroke="#d9e2ef"/><text x="80" y="288" class="body">FPT Software</text><rect x="58" y="322" width="496" height="52" rx="8" fill="#fbfcfe" stroke="#d9e2ef"/><text x="80" y="354" class="body">TMA Software Labs</text><rect x="612" y="112" width="556" height="300" rx="14" class="card"/><circle cx="890" cy="194" r="30" fill="#eef2f7"/><text x="878" y="204" font-family="Inter" font-size="28" fill="#8da1c3">⌕</text><text x="814" y="250" class="title">Không có kết quả</text><text x="745" y="280" class="body">Không tìm thấy mục thỏa điều kiện hiện tại.</text><rect x="822" y="320" width="136" height="38" rx="6" fill="#fff" stroke="#bfcee0"/><text x="845" y="344" class="btn">Xóa bộ lọc</text><rect x="32" y="450" width="1136" height="108" rx="12" fill="#fff8e8" stroke="#f5c84b"/><text x="58" y="487" class="title" fill="#9a5a00">Kết hợp nhiều tiêu chí</text><text x="58" y="518" class="body">Q-009-01 chưa quy định AND/OR hoặc thứ tự áp dụng; asset không ghi một cách kết hợp là quy tắc đã xác nhận.</text><rect x="32" y="592" width="1136" height="66" rx="12" fill="#eef6ff"/><text x="58" y="632" class="body" fill="#1d4ed8">Loading/error giữ nguyên từ khóa và tiêu chí để Sales có thể thử lại.</text><text x="32" y="736" class="hint">SCR-US009-03 · US-009 · AC-021..023 · Empty presentation là giả định UX theo Q-009-03.</text></svg>
