<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">SCR-US002-04 — Chuyển đầu mối chính (PIC)</title>
<desc id="desc">So sánh trạng thái trước và sau khi chuyển đầu mối chính sang một người liên hệ khác.</desc>
<style>.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d9e2ef}.h1{font:700 25px Inter,'Segoe UI',Arial,sans-serif;fill:#07152f}.title{font:700 16px Inter,'Segoe UI',Arial,sans-serif;fill:#172743}.body{font:400 14px Inter,'Segoe UI',Arial,sans-serif;fill:#536784}.strong{font:700 14px Inter,'Segoe UI',Arial,sans-serif;fill:#07152f}.tag{font:600 11px Inter,'Segoe UI',Arial,sans-serif}.btn{font:600 13px Inter,'Segoe UI',Arial,sans-serif}.hint{font:400 12px Inter,'Segoe UI',Arial,sans-serif;fill:#8da1c3}</style>
<rect width="1200" height="760" class="bg"/>
<text x="32" y="48" class="h1">Chuyển đầu mối chính (PIC)</text>
<text x="32" y="75" class="body">Một Công ty luôn chỉ hiển thị đúng một nhãn PIC tại một thời điểm.</text>

<rect x="32" y="112" width="540" height="370" rx="14" class="card"/>
<text x="58" y="150" class="title">Trước khi chuyển</text>
<rect x="58" y="180" width="488" height="104" rx="10" fill="#f8faff" stroke="#d9e2ef"/><text x="82" y="216" class="strong">Nguyễn Minh Tuấn</text><text x="82" y="242" class="body">Giám đốc Chuyển đổi số</text><rect x="434" y="207" width="76" height="28" rx="14" fill="#eef0ff"/><text x="458" y="226" class="tag" fill="#4634f2">PIC</text>
<rect x="58" y="300" width="488" height="130" rx="10" fill="#fff" stroke="#d9e2ef"/><text x="82" y="336" class="strong">Hoàng Thu Lan</text><text x="82" y="362" class="body">Trưởng phòng Mua hàng</text><rect x="390" y="378" width="120" height="34" rx="6" fill="#5236f5"/><text x="407" y="400" class="btn" fill="#fff">Đặt làm PIC</text>

<text x="586" y="307" font-family="Inter,'Segoe UI',Arial" font-size="30" fill="#8da1c3">→</text>

<rect x="628" y="112" width="540" height="370" rx="14" class="card"/>
<text x="654" y="150" class="title">Sau khi chuyển</text>
<rect x="654" y="180" width="488" height="104" rx="10" fill="#fff" stroke="#d9e2ef"/><text x="678" y="216" class="strong">Nguyễn Minh Tuấn</text><text x="678" y="242" class="body">Giám đốc Chuyển đổi số</text>
<rect x="654" y="300" width="488" height="104" rx="10" fill="#f8faff" stroke="#c4c8ff"/><text x="678" y="336" class="strong">Hoàng Thu Lan</text><text x="678" y="362" class="body">Trưởng phòng Mua hàng</text><rect x="1030" y="327" width="76" height="28" rx="14" fill="#eef0ff"/><text x="1054" y="346" class="tag" fill="#4634f2">PIC</text>

<rect x="32" y="516" width="1136" height="78" rx="12" fill="#ecfdf5" stroke="#86efac"/><text x="58" y="548" class="title" fill="#166534">✓ Đã chuyển đầu mối chính</text><text x="58" y="576" class="body" fill="#166534">Hoàng Thu Lan là PIC duy nhất của FPT Software; nhãn của Nguyễn Minh Tuấn đã được gỡ.</text>

<rect x="32" y="620" width="1136" height="64" rx="12" fill="#fff8e8" stroke="#f5c84b"/><text x="58" y="647" class="title" fill="#9a5a00">Xóa người liên hệ đang là PIC</text><text x="58" y="671" class="body">Kết quả khi xóa chính người đang mang nhãn PIC chưa được xác nhận trong docs/02-analysis — xem Q-002-03.</text>
<text x="32" y="736" class="hint">SCR-US002-04 · US-002 · AC-006 · BR-002, BR-US002-02</text>
