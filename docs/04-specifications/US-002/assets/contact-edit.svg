<text x="248" y="432" class="label">Email</text><rect x="248" y="449" width="704" height="45" rx="6" class="input"/><text x="264" y="477" class="value">lanht@fpt.com</text>

<rect x="248" y="534" width="22" height="22" rx="5" fill="#fff" stroke="#bfcee0"/><text x="284" y="551" class="label">Đặt làm đầu mối chính (PIC) của FPT Software</text>
<text x="284" y="575" class="hint">Người liên hệ này chưa là PIC; đánh dấu sẽ chuyển nhãn từ Nguyễn Minh Tuấn sang đây.</text>

<rect x="740" y="612" width="92" height="44" rx="7" fill="#fff" stroke="#bfcee0"/><text x="769" y="640" class="btn" fill="#263a59">Hủy</text>
<rect x="846" y="612" width="140" height="44" rx="7" fill="#5236f5"/><text x="864" y="640" class="btn" fill="#fff">Lưu thay đổi</text>
<text x="28" y="724" class="hint">SCR-US002-03 · US-002 · AC-007, AC-006 · Thay đổi (gồm chuyển PIC nếu chọn) được ghi nhận.</text>
<text x="28" y="744" class="hint">Ràng buộc bắt buộc/tùy chọn và định dạng trường chưa được xác nhận — xem Q-002-02.</text>
