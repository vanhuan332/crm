<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">SCR-US002-03 — Sửa Người liên hệ</title>
<desc id="desc">Biểu mẫu chỉnh sửa người liên hệ đã tồn tại, dữ liệu hiện tại được điền sẵn.</desc>
<style>.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d9e2ef}.h1{font:700 26px Inter,'Segoe UI',Arial,sans-serif;fill:#07152f}.sub{font:400 14px Inter,'Segoe UI',Arial,sans-serif;fill:#64748b}.section{font:700 15px Inter,'Segoe UI',Arial,sans-serif;fill:#263a59;letter-spacing:.3px}.label{font:500 14px Inter,'Segoe UI',Arial,sans-serif;fill:#14233e}.input{fill:#fff;stroke:#becde1}.value{font:400 14px Inter,'Segoe UI',Arial,sans-serif;fill:#07152f}.hint{font:400 12px Inter,'Segoe UI',Arial,sans-serif;fill:#8da1c3}.btn{font:600 14px Inter,'Segoe UI',Arial,sans-serif}</style>
<rect width="1200" height="760" class="bg"/>
<text x="28" y="34" class="sub">Công ty  ›  FPT Software  ›  Người liên hệ  ›  <tspan font-weight="600" fill="#263a59">Sửa</tspan></text>
<text x="28" y="82" class="h1">Sửa người liên hệ</text>

<rect x="214" y="116" width="772" height="474" rx="14" class="card"/>
<rect x="248" y="150" width="5" height="25" rx="3" fill="#695cff"/><text x="266" y="169" class="section">THÔNG TIN NGƯỜI LIÊN HỆ</text>
