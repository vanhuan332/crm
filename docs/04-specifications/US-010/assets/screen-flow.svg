<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">US-010 — Luồng màn hình Tổng quan</title>
  <desc id="desc">Wireframe nghiệp vụ cho US-010, truy vết AC-024: Sales mở Tổng quan và thấy ba nhóm số liệu tổng hợp từ Công ty, Cơ hội và Việc tiếp theo.</desc>
  <style>
    .bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d9e2ef}.line{stroke:#e6ebf2}
    .h1{font:700 25px Inter,'Segoe UI',Arial,sans-serif;fill:#07152f}
    .sub{font:400 14px Inter,'Segoe UI',Arial,sans-serif;fill:#64748b}
    .section{font:700 15px Inter,'Segoe UI',Arial,sans-serif;fill:#263a59;letter-spacing:.3px}
    .body{font:400 14px Inter,'Segoe UI',Arial,sans-serif;fill:#3f526f}
    .hint{font:400 12px Inter,'Segoe UI',Arial,sans-serif;fill:#8da1c3}
    .chip{fill:#eef0ff}.chiptext{font:700 12px Inter,'Segoe UI',Arial,sans-serif;fill:#4634f2}
    .banner{font:600 15px Inter,'Segoe UI',Arial,sans-serif;fill:#172743}
    .note{font:400 13px Inter,'Segoe UI',Arial,sans-serif;fill:#5e7393}
  </style>
  <rect width="1200" height="760" class="bg"/>
  <text x="32" y="48" class="h1">Luồng màn hình Tổng quan</text>
  <text x="32" y="75" class="sub">US-010 · Sales · REQ-112</text>
  <rect x="820" y="30" width="150" height="30" rx="15" class="chip"/>
  <text x="846" y="50" class="chiptext">AC-024</text>

  <rect x="32" y="104" width="1136" height="64" rx="14" class="card"/>
  <circle cx="70" cy="136" r="14" fill="#5236f5"/><text x="63" y="141" font-family="Inter" font-size="13" font-weight="700" fill="#fff">S</text>
  <text x="96" y="132" class="banner">Sales mở màn hình Tổng quan từ điều hướng chính</text>
  <text x="96" y="153" class="hint">Không nhập liệu; hệ thống chỉ tổng hợp dữ liệu Nhóm 1 hiện có (BR-US010-04)</text>

  <line x1="600" y1="168" x2="600" y2="196" stroke="#bfcee0" stroke-width="2"/>
  <polygon points="600,204 593,190 607,190" fill="#bfcee0"/>

  <rect x="32" y="212" width="360" height="430" rx="14" class="card"/>
  <rect x="60" y="242" width="5" height="24" rx="3" fill="#695cff"/>
  <text x="78" y="261" class="section">SCR-US010-01 · Công ty theo ngành</text>
  <circle cx="66" cy="300" r="5" fill="#5236f5"/><text x="82" y="306" class="body">Tổng số Công ty đang hoạt động</text>
  <circle cx="66" cy="340" r="5" fill="#5236f5"/><text x="82" y="346" class="body">Số lượng theo từng ngành</text>
  <circle cx="66" cy="380" r="5" fill="#5236f5"/><text x="82" y="386" class="body">Nguồn: Công ty (US-001/FEAT-001)</text>
  <circle cx="66" cy="420" r="5" fill="#5236f5"/><text x="82" y="426" class="body">Chỉ đọc, không chỉnh sửa từ đây</text>
  <circle cx="66" cy="460" r="5" fill="#5236f5"/><text x="82" y="466" class="body">Empty khi chưa có Công ty (Q-010-02)</text>
  <text x="60" y="616" class="hint">BR-US010-01 · AC-024</text>

  <rect x="420" y="212" width="360" height="430" rx="14" class="card"/>
  <rect x="448" y="242" width="5" height="24" rx="3" fill="#695cff"/>
  <text x="466" y="261" class="section">SCR-US010-02 · Cơ hội theo giai đoạn</text>
  <circle cx="454" cy="300" r="5" fill="#5236f5"/><text x="470" y="306" class="body">Số lượng Cơ hội theo giai đoạn</text>
  <circle cx="454" cy="340" r="5" fill="#5236f5"/><text x="470" y="346" class="body">Tổng giá trị Cơ hội theo giai đoạn</text>
  <circle cx="454" cy="380" r="5" fill="#5236f5"/><text x="470" y="386" class="body">Nguồn: Cơ hội (US-003/FEAT-003)</text>
  <circle cx="454" cy="420" r="5" fill="#5236f5"/><text x="470" y="426" class="body">7 giai đoạn nghiệp vụ (FEAT-004)</text>
  <circle cx="454" cy="460" r="5" fill="#5236f5"/><text x="470" y="466" class="body">Empty khi chưa có Cơ hội (Q-010-02)</text>
  <text x="448" y="616" class="hint">BR-US010-02 · AC-024</text>

  <rect x="808" y="212" width="360" height="430" rx="14" class="card"/>
  <rect x="836" y="242" width="5" height="24" rx="3" fill="#695cff"/>
  <text x="854" y="261" class="section">SCR-US010-03 · Việc quá hạn</text>
  <circle cx="842" cy="300" r="5" fill="#5236f5"/><text x="858" y="306" class="body">Danh sách Việc tiếp theo quá hạn</text>
  <circle cx="842" cy="340" r="5" fill="#5236f5"/><text x="858" y="346" class="body">Kèm Cơ hội và Công ty liên quan</text>
  <circle cx="842" cy="380" r="5" fill="#5236f5"/><text x="858" y="386" class="body">Nguồn: Việc tiếp theo (US-008/FEAT-008)</text>
  <circle cx="842" cy="420" r="5" fill="#5236f5"/><text x="858" y="426" class="body">Định nghĩa "quá hạn" — mở (Q-010-01)</text>
  <circle cx="842" cy="460" r="5" fill="#5236f5"/><text x="858" y="466" class="body">Empty khi không có việc quá hạn (Q-010-02)</text>
  <text x="836" y="616" class="hint">BR-US010-03 · AC-024</text>

  <rect x="32" y="668" width="1136" height="66" rx="12" fill="#f1f5f9"/>
  <text x="56" y="694" class="note">Tổng quan chỉ đọc dữ liệu Nhóm 1 (Công ty, Cơ hội, Việc tiếp theo); không tạo/sửa/xoá từ màn hình này.</text>
  <text x="56" y="715" class="note">Không quyết định framework, component library, endpoint hoặc cấu trúc triển khai.</text>
</svg>
