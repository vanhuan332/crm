<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">SCR-US010-03 — Việc tiếp theo quá hạn</title>
  <desc id="desc">Danh sách Việc tiếp theo quá hạn trên màn hình Tổng quan, kèm Cơ hội và Công ty liên quan.</desc>
  <style>
    .bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d9e2ef}.line{stroke:#e6ebf2}
    .h1{font:700 25px Inter,'Segoe UI',Arial,sans-serif;fill:#07152f}
    .sub{font:400 14px Inter,'Segoe UI',Arial,sans-serif;fill:#64748b}
    .th{font:700 12px Inter,'Segoe UI',Arial,sans-serif;fill:#60718f;letter-spacing:.45px}
    .body{font:400 14px Inter,'Segoe UI',Arial,sans-serif;fill:#3f526f}
    .strong{font:700 14px Inter,'Segoe UI',Arial,sans-serif;fill:#07152f}
    .tag{font:600 11px Inter,'Segoe UI',Arial,sans-serif}
    .section{font:700 15px Inter,'Segoe UI',Arial,sans-serif;fill:#263a59;letter-spacing:.3px}
    .hint{font:400 12px Inter,'Segoe UI',Arial,sans-serif;fill:#8da1c3}
  </style>
  <rect width="1200" height="700" class="bg"/>
  <text x="32" y="48" class="h1">Việc tiếp theo quá hạn</text>
  <text x="32" y="75" class="sub">Các việc cần Sales chú ý ngay trên Tổng quan</text>

  <rect x="32" y="112" width="1136" height="14" rx="7" fill="none"/>
  <rect x="60" y="106" width="5" height="20" rx="3" fill="#695cff"/>

  <rect x="32" y="130" width="1136" height="412" rx="14" class="card"/>
  <rect x="33" y="131" width="1134" height="62" rx="13" fill="#fbfcfe"/>
  <text x="58" y="169" class="th">HẠN</text>
  <text x="220" y="169" class="th">VIỆC TIẾP THEO</text>
  <text x="650" y="169" class="th">CƠ HỘI</text>
  <text x="900" y="169" class="th">CÔNG TY</text>
  <line x1="32" y1="193" x2="1168" y2="193" class="line"/>

  <rect x="58" y="222" width="110" height="30" rx="15" fill="#fff1f2"/>
  <text x="76" y="242" class="tag" fill="#dc2626">12/08/2026</text>
  <text x="220" y="242" class="strong">Gửi đề xuất vòng 2</text>
  <text x="650" y="242" class="body">ERP Transformation</text>
  <text x="900" y="242" class="body">FPT Software</text>
  <line x1="32" y1="277" x2="1168" y2="277" class="line"/>

  <rect x="58" y="306" width="110" height="30" rx="15" fill="#fff1f2"/>
  <text x="76" y="326" class="tag" fill="#dc2626">13/08/2026</text>
  <text x="220" y="326" class="strong">Xác nhận lịch workshop</text>
  <text x="650" y="326" class="body">Cloud Migration</text>
  <text x="900" y="326" class="body">FPT Software</text>
  <line x1="32" y1="361" x2="1168" y2="361" class="line"/>

  <rect x="58" y="390" width="110" height="30" rx="15" fill="#fff1f2"/>
  <text x="76" y="410" class="tag" fill="#dc2626">14/08/2026</text>
  <text x="220" y="410" class="strong">Bổ sung báo giá</text>
  <text x="650" y="410" class="body">Managed Service</text>
  <text x="900" y="410" class="body">CMC Technology</text>
  <line x1="32" y1="445" x2="1168" y2="445" class="line"/>

  <text x="58" y="482" class="hint">Sắp xếp minh hoạ theo hạn gần nhất trước; thứ tự khi đồng hạn chưa được xác nhận.</text>

  <rect x="32" y="562" width="1136" height="70" rx="12" fill="#fff8e8" stroke="#f5e2ab"/>
  <text x="58" y="590" class="body">Định nghĩa thời điểm/múi giờ tính "quá hạn" và thứ tự khi đồng hạn còn để mở — <tspan font-weight="700">Q-010-01</tspan>.</text>
  <text x="58" y="612" class="body">Cách trình bày khi không có việc quá hạn (empty state) còn để mở — <tspan font-weight="700">Q-010-02</tspan>.</text>

  <text x="32" y="670" class="hint">SCR-US010-03 · US-010 · AC-024 · BR-US010-03</text>
