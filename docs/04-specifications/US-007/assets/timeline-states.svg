<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">SCR-US007-03 — Trạng thái Timeline</title><desc id="desc">Empty, loading, lỗi thử lại và quy tắc loại hoạt động.</desc><style>.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d9e2ef}.h1{font:700 25px Inter,'Segoe UI',Arial;fill:#07152f}.title{font:700 16px Inter,'Segoe UI',Arial;fill:#172743}.body{font:400 14px Inter,'Segoe UI',Arial;fill:#536784}.hint{font:400 12px Inter,'Segoe UI',Arial;fill:#8da1c3}.btn{font:600 13px Inter,'Segoe UI',Arial}</style><rect width="1200" height="760" class="bg"/><text x="32" y="48" class="h1">Trạng thái Dòng thời gian</text><text x="32" y="75" class="body">Giữ thứ tự mới nhất trên và không thêm loại nghiệp vụ mới.</text><rect x="32" y="112" width="350" height="250" rx="14" class="card"/><circle cx="207" cy="180" r="26" fill="#eef2f7"/><text x="198" y="189" font-family="Inter" font-size="24" fill="#8da1c3">○</text><text x="140" y="235" class="title">Chưa có lịch sử</text><text x="90" y="266" class="body">Ghi hoạt động đầu tiên cho Công ty.</text><rect x="132" y="300" width="150" height="36" rx="6" fill="#5236f5"/><text x="154" y="323" class="btn" fill="#fff">Ghi hoạt động</text><rect x="425" y="112" width="350" height="250" rx="14" class="card"/><text x="451" y="150" class="title">Đang tải</text><rect x="451" y="180" width="298" height="26" rx="8" fill="#eef2f7"/><rect x="451" y="222" width="240" height="18" rx="7" fill="#eef2f7"/><rect x="451" y="266" width="298" height="26" rx="8" fill="#eef2f7"/><rect x="451" y="308" width="210" height="18" rx="7" fill="#eef2f7"/><rect x="818" y="112" width="350" height="250" rx="14" class="card"/><circle cx="993" cy="180" r="26" fill="#fff1f2"/><text x="985" y="188" font-family="Inter" font-size="22" fill="#dc2626">!</text><text x="920" y="235" class="title">Không thể tải timeline</text><text x="875" y="266" class="body">Giữ ngữ cảnh Công ty và thử lại.</text><rect x="946" y="300" width="94" height="36" rx="6" fill="#fff" stroke="#bfcee0"/><text x="968" y="323" class="btn">Thử lại</text><rect x="32" y="402" width="1136" height="108" rx="12" fill="#eef6ff"/><text x="58" y="439" class="title" fill="#1d4ed8">Tập loại hoạt động cố định</text><text x="58" y="470" class="body">Gặp mặt · Gọi điện · Gửi tài liệu · Email · Khách phản hồi · Khác</text><text x="58" y="494" class="hint">Phản hồi khi giá trị nằm ngoài tập vẫn là Q-US007-01.</text><rect x="32" y="544" width="1136" height="82" rx="12" fill="#fff8e8"/><text x="58" y="578" class="title" fill="#9a5a00">Các mục cùng thời điểm</text><text x="58" y="605" class="body">Không tự đặt thứ tự phụ khi Q-US007-02 chưa được PO quyết định.</text><text x="32" y="710" class="hint">SCR-US007-03 · US-007 · AC-017, AC-018</text></svg>
