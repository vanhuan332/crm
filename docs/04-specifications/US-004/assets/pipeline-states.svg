<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">SCR-US004-03 — Trạng thái Pipeline</title><desc id="desc">Trạng thái empty, đang lưu, lỗi hoàn tác và ranh giới câu hỏi Thắng Thua.</desc><style>.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d9e2ef}.h1{font:700 25px Inter,'Segoe UI',Arial;fill:#07152f}.title{font:700 16px Inter,'Segoe UI',Arial;fill:#172743}.body{font:400 14px Inter,'Segoe UI',Arial;fill:#536784}.hint{font:400 12px Inter,'Segoe UI',Arial;fill:#8da1c3}.btn{font:600 13px Inter,'Segoe UI',Arial}</style><rect width="1200" height="760" class="bg"/><text x="32" y="48" class="h1">Trạng thái bảng Pipeline</text><text x="32" y="75" class="body">Phản hồi rõ mà không thay đổi quy tắc kéo-thả của Sales.</text>
<rect x="32" y="112" width="350" height="250" rx="14" class="card"/><circle cx="207" cy="180" r="26" fill="#eef2f7"/><text x="197" y="189" font-family="Inter" font-size="26" fill="#8da1c3">＋</text><text x="142" y="235" class="title">Cột chưa có Cơ hội</text><text x="91" y="266" class="body">Giữ cột đúng vị trí trong bảy giai đoạn.</text><text x="103" y="298" class="hint">Không cho đổi tên hoặc ẩn cột.</text>
<rect x="425" y="112" width="350" height="250" rx="14" class="card"/><circle cx="600" cy="180" r="26" fill="#eef6ff"/><text x="590" y="189" font-family="Inter" font-size="24" fill="#1d4ed8">…</text><text x="532" y="235" class="title">Đang cập nhật</text><text x="489" y="266" class="body">Thẻ giữ tại vị trí đích trong lúc lưu.</text><text x="500" y="298" class="hint">Không cho kéo lặp cùng một thẻ.</text>
<rect x="818" y="112" width="350" height="250" rx="14" class="card"/><circle cx="993" cy="180" r="26" fill="#fff1f2"/><text x="985" y="188" font-family="Inter" font-size="22" fill="#dc2626">!</text><text x="926" y="235" class="title">Không thể cập nhật</text><text x="866" y="266" class="body">Trả thẻ về vị trí cũ và cho phép thử lại.</text><rect x="946" y="300" width="94" height="36" rx="6" fill="#fff" stroke="#bfcee0"/><text x="968" y="323" class="btn" fill="#263a59">Thử lại</text>
<rect x="32" y="400" width="1136" height="102" rx="12" fill="#fff8e8" stroke="#f5c84b"/><text x="58" y="438" class="title" fill="#9a5a00">Kéo vào Thắng hoặc Thua</text><text x="58" y="468" class="body">US-004 cho phép đích trong danh mục cố định; cảnh báo xác nhận riêng vẫn là Q-004-01, nên asset không tự thêm bước chặn.</text><rect x="32" y="536" width="1136" height="92" rx="12" fill="#eef6ff"/><text x="58" y="572" class="title" fill="#1d4ed8">Ranh giới automation</text><text x="58" y="601" class="body">Màn hình mô tả thao tác của Sales; A-AI không được tự đổi giai đoạn, kể cả ngoài UI.</text><text x="32" y="710" class="hint">SCR-US004-03 · US-004 · AC-010..012 · Empty/loading/error là biểu đạt UX hỗ trợ phục hồi.</text></svg>
