    <line x1="14" y1="44" x2="166" y2="44" stroke="#e6ebf2"/>
    <rect x="14" y="58" width="152" height="66" rx="8" class="card"/>
    <text x="26" y="80" class="strong">TMA Solutions</text><text x="26" y="96" class="hint">Website redesign</text><text x="26" y="112" class="hint">150tr · T09/2026</text>
    <rect x="14" y="134" width="152" height="66" rx="8" class="card"/>
    <text x="26" y="156" class="strong">Nashtech</text><text x="26" y="172" class="hint">ERP migration</text><text x="26" y="188" class="hint">420tr · T10/2026</text>
  </g>

