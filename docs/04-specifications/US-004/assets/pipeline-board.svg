  <text x="32" y="748" class="foot">Mở: Tiếp cận · Đủ điều kiện · Soạn đề xuất · Thương lượng · Tạm dừng — Đóng: Thắng · Thua (BR-004).</text>
  <text x="32" y="768" class="foot">SCR-US004-01 · US-004 · AC-012 · BR-US004-01, BR-US004-04</text>
