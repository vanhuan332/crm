<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">SCR-US004-01 — Bảng Pipeline 7 giai đoạn</title>
  <desc id="desc">Bảng phễu bán hàng với đúng bảy cột giai đoạn cố định, đúng thứ tự, mỗi cột hiển thị các cơ hội đang ở giai đoạn đó.</desc>
  <style>
    .bg{fill:#f7f9fc}.h1{font:700 25px Inter,'Segoe UI',Arial,sans-serif;fill:#07152f}.sub{font:400 14px Inter,'Segoe UI',Arial,sans-serif;fill:#64748b}.col{fill:#fff;stroke:#d9e2ef}.th{font:700 12px Inter,'Segoe UI',Arial,sans-serif;fill:#60718f;letter-spacing:.4px}.count{font:400 12px Inter,'Segoe UI',Arial,sans-serif;fill:#8da1c3}.card{fill:#fff;stroke:#e6ebf2}.strong{font:600 12.5px Inter,'Segoe UI',Arial,sans-serif;fill:#07152f}.hint{font:400 11px Inter,'Segoe UI',Arial,sans-serif;fill:#64748b}.foot{font:400 12px Inter,'Segoe UI',Arial,sans-serif;fill:#8da1c3}
  </style>
  <rect width="1400" height="780" class="bg"/>
  <text x="32" y="46" class="h1">Pipeline</text>
  <text x="32" y="70" class="sub">7 giai đoạn cố định · 8 cơ hội</text>

  <!-- Column 1: Tiếp cận -->
